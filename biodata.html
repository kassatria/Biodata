<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Kanisian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .kanisian-header {
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .card {
            height: 100%; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="text-center kanisian-header">
            <h1 class="fw-bold text-uppercase">Biodata Kanisian</h1>
            <p class="lead text-muted fst-italic">"Pelajar Kolese Kanisius Angkatan CC27"</p>
            <hr class="w-50 mx-auto">
        </div>

        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card border-primary">
                    <div class="card-header bg-primary text-white text-center">
                        <h5>Biodata</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled">
                            <li> Nicholas Raka Satria Purwadi</li>
                            <li> Lahir pada 16 Maret 2009</li>
                            <li> 171 cm, 60 kg</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-success">
                    <div class="card-header bg-success text-white text-center">
                        <h5>Kepribadian</h5>
                    </div>
                    <div class="card-body">
                        <span class="badge bg-secondary">Procrastinator</span>
                        <span class="badge bg-secondary">Nice</span>
                        <span class="badge bg-secondary">Consistently bored</span>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card border-warning">
                    <div class="card-header bg-warning text-dark text-center">
                        <h5>Hobi</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">Menulis</li>
                            <li class="list-group-item">Membaca</li>
                            <li class="list-group-item">Menonton </li>
                        </ul>
                    </div>
                </div>
            </div>

        </div> <div class="d-flex justify-content-center mt-5 mb-5">
            <div class="btn-group btn-group-lg" role="group" aria-label="Tombol Aksi">
                <button type="button" class="btn btn-outline-danger">
                    Like
                </button>
                <button type="button" class="btn btn-outline-primary">
                    Post
                </button>
                <button type="button" class="btn btn-outline-dark">
                    Back
                </button>
            </div>
        </div>

    </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
